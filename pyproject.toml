[project]
name = "bazaar-contrib-server-migrations"
version = "0.3.0rc2"
description = "Published Server 1–7 historical database upgrades, and the events held by id"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-storage~=0.3.0rc1",
    "bazaar-contrib-schema~=0.3.0rc1",
    "bazaar-contrib-server-database~=0.3.0rc1",
]

[project.entry-points."bazaar_compute_node.contribs"]
server-migrations = "bazaar_contrib_server_migrations:migrations"

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-server-migrations"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "bazaar-contrib-collaboration~=0.3.0rc1",
    "bazaar-contrib-legacy-node-migrations~=0.3.0rc1",
    "bazaar-contrib-messages-node~=0.3.0rc1",
    "bazaar-contrib-sqlite~=0.3.0rc1",
    "bazaar-contrib-timer-wheel~=0.3.0rc1",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
